name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: openai-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MODEL: gpt-5.4
      MAX_COMPLETION_TOKENS: "4000"
      MAX_DIFF_BYTES: "51200"

    steps:
      - name: Check OPENAI_API_KEY availability
        id: check_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY secret not set; skipping AI review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check_key.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.check_key.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install openai
        if: steps.check_key.outputs.skip == 'false'
        run: pip install "openai>=1.50,<2"

      - name: Fetch PR diff
        if: steps.check_key.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          # Exclude binary assets and auto-generated files: the model can't
          # read bytes, and .import files are regenerated by Godot.
          git diff "$BASE_SHA...$HEAD_SHA" -- . \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.webp' \
            ':(exclude)*.bmp' \
            ':(exclude)*.ico' \
            ':(exclude)*.ogg' \
            ':(exclude)*.mp3' \
            ':(exclude)*.wav' \
            ':(exclude)*.flac' \
            ':(exclude)*.aseprite' \
            ':(exclude)*.ase' \
            ':(exclude)*.ttf' \
            ':(exclude)*.otf' \
            ':(exclude)*.import' \
            > diff.patch

      - name: Run AI review
        if: steps.check_key.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ env.MODEL }}
          MAX_COMPLETION_TOKENS: ${{ env.MAX_COMPLETION_TOKENS }}
          MAX_DIFF_BYTES: ${{ env.MAX_DIFF_BYTES }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/ai_review.py

      - name: Post review comment
        if: steps.check_key.outputs.skip == 'false' && hashFiles('review.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
